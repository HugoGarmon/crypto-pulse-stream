version: "3.8"

networks:
  crypto_net:
    driver: bridge

volumes:
  clickhouse_data:
    driver: local

services:
  # ---------------------------------------------------------------------------
  # 1. Message Broker: Redpanda (Kafka-compatible, C++ zero-JVM)
  # ---------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: crypto_redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - "512M"
      - --overprovisioned
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"
      - "9644:9644"
    networks:
      - crypto_net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy|OK' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 2. Redpanda Console: Web UI para inspección de topics y throughput
  # ---------------------------------------------------------------------------
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: crypto_redpanda_console
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_SCHEMAREGISTRY_ENABLED: "false"
    ports:
      - "8080:8080"
    networks:
      - crypto_net
    depends_on:
      redpanda:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 3. Storage OLAP: ClickHouse Server
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: crypto_clickhouse
    environment:
      CLICKHOUSE_DB: crypto_intelligence
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./infra/clickhouse/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
      - clickhouse_data:/var/lib/clickhouse/
    networks:
      - crypto_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 4. Stream Ingestion: Python Producer (Binance -> Redpanda)
  # ---------------------------------------------------------------------------
  producer:
    build:
      context: ./services/producer
      dockerfile: Dockerfile
    container_name: crypto_producer
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    networks:
      - crypto_net
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
